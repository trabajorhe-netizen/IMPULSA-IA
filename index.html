<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>IMPULSA IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #172554, #020617 55%);
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 24px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #38bdf8;
    }

    main {
      width: min(900px, 90%);
      margin: 60px auto;
      text-align: center;
    }

    h1 {
      font-size: clamp(38px, 7vw, 70px);
      margin-bottom: 15px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 20px;
      line-height: 1.5;
      max-width: 700px;
      margin: 0 auto 40px;
    }

    .card {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 30px;
      text-align: left;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border-radius: 14px;
      border: 1px solid #475569;
      background: #020617;
      color: white;
      padding: 18px;
      font-size: 17px;
      outline: none;
    }

    textarea:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      padding: 17px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      color: #020617;
      background: linear-gradient(90deg, #38bdf8, #22d3ee);
    }

    button:hover {
      opacity: .9;
    }

    #resultado {
      display: none;
      margin-top: 25px;
      padding: 22px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
.resultado-grid {
  display: grid;
  gap: 16px;
}

.resultado-card {
  background: #0b1328;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 20px;
}
.resultado-card:last-child {
  grid-column: 1 / -1;
}
.resultado-card h3 {
  margin: 0 0 12px;
  font-size: 18px;
  color: #7dd3fc;
}

.resultado-card p {
  margin: 0;
  line-height: 1.6;
}

.copiar-btn {
  margin-top: 16px;
  width: auto;
  padding: 9px 14px;
  border-radius: 9px;
  font-size: 14px;
  cursor: pointer;
}

.copiar-btn:hover {
  opacity: 0.85;
}
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid #38bdf8;
      color: #7dd3fc;
      border-radius: 999px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #64748b;
      padding: 40px 20px;
    }
    /* Diseño profesional de resultados IMPULSA IA */

.resultado-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.resultado-card {
  position: relative;
  background: linear-gradient(145deg, #0b1328, #101d38);
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.resultado-card:hover {
  transform: translateY(-2px);
  border-color: #38bdf8;
}

.resultado-card h3 {
  margin: 0 0 14px;
  font-size: 18px;
  line-height: 1.35;
  color: #7dd3fc;
}

.resultado-card p {
  margin: 0;
  line-height: 1.7;
  color: #e2e8f0;
  white-space: normal;
}

.copiar-btn {
  margin-top: 18px;
  width: auto;
  padding: 9px 15px;
  border: 0;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

@media (max-width: 800px) {
  .resultado-grid {
    grid-template-columns: 1fr;
  }

  .resultado-card {
    padding: 18px;
  }
}
  </style>
</head>

<body>

<header>
  <div class="logo">IMPULSA <span>IA</span></div>
  <div>Marketing inteligente</div>
</header>

<main>

  <div class="badge">✦ Inteligencia artificial para tu negocio</div>

  <h1>
    Convierte una idea en una campaña.
  </h1>

  <p class="subtitle">
    Describe tu promoción y deja que IMPULSA IA prepare
    una campaña de marketing en segundos.
  </p>

  <div class="card">

    <label for="promocion">
      ¿Qué quieres promocionar?
    </label>

    <textarea
      id="promocion"
      placeholder="Ejemplo: 30% de descuento en todos los zapatos este fin de semana..."
    ></textarea>

    <button onclick="generarCampana()">
      ✦ Generar campaña
    </button>

    <div id="resultado"></div>

  </div>

</main>

<footer>
  IMPULSA IA · Marketing impulsado por inteligencia artificial
</footer>

<script>
async function generarCampana() {
  const promocion = document.getElementById("promocion").value.trim();
  const resultado = document.getElementById("resultado");

  if (!promocion) {
    resultado.style.display = "block";
    resultado.textContent =
      "Escribe primero qué producto, servicio o promoción quieres anunciar.";
    return;
  }
  resultado.style.display = "block";
  resultado.textContent = "✨ IMPULSA IA está creando tu campaña...";

  try {
    const respuesta = await fetch("/api/generar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ promocion })
    });

    const datos = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(datos.error || "No se pudo generar la campaña.");
    }

    const bloques = datos.resultado
  .split(/^###\s+/m)
  .map(bloque => bloque.trim())
  .filter(Boolean);

resultado.innerHTML = '<div class="resultado-grid"></div>';

const grid = resultado.querySelector(".resultado-grid");

const escaparHTML = texto =>
  texto
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

bloques.forEach(bloque => {
  const lineas = bloque.split("\n");
  const titulo = lineas.shift().replace(/\*\*/g, "").trim();
  const contenido = lineas.join("\n").trim();

  const contenidoFormateado = escaparHTML(contenido)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");

  const tarjeta = document.createElement("div");
  tarjeta.className = "resultado-card";
  if (titulo.startsWith("7.")) {
  tarjeta.style.gridColumn = "1 / -1";
}

  tarjeta.innerHTML = `
    <h3>${escaparHTML(titulo)}</h3>
    <p>${contenidoFormateado}</p>
  `;

  const boton = document.createElement("button");
  boton.className = "copiar-btn";
  boton.textContent = "📋 Copiar";

  boton.addEventListener("click", async () => {
    await navigator.clipboard.writeText(
      `${titulo}\n\n${contenido.replace(/\*\*/g, "")}`
    );

    boton.textContent = "✓ Copiado";

    setTimeout(() => {
      boton.textContent = "📋 Copiar";
    }, 1500);
  });

  tarjeta.appendChild(boton);
  grid.appendChild(tarjeta);
});

    if (datos.imagen) {
  const tarjetaImagen = document.createElement("div");
  tarjetaImagen.className = "resultado-card";
  tarjetaImagen.style.gridColumn = "1 / -1";

  tarjetaImagen.innerHTML = `
    <h3>8. Imagen publicitaria generada</h3>
    <img
      src="data:image/png;base64,${datos.imagen}"
      alt="Imagen publicitaria generada por IMPULSA IA"
      style="width:100%; max-width:1024px; display:block; margin:20px auto 0; border-radius:14px;"
    >
    <a
  href="data:image/png;base64,${datos.imagen}"
  download="IMPULSA-IA-campana.png"
  class="copiar-btn"
  style="display:inline-block; text-decoration:none; margin-top:10px;"
>
  ⬇ Descargar imagen
</a>
  `;

  grid.appendChild(tarjetaImagen);
}
  } catch (error) {
    console.error(error);
    resultado.textContent =
      "No fue posible generar la campaña. Inténtalo nuevamente.";
  }
}
</script>

</body>
</html>
