<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IMPULSA IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #172554, #020617 55%);
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 24px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #38bdf8;
    }

    main {
      width: min(900px, 90%);
      margin: 60px auto;
      text-align: center;
    }

    h1 {
      font-size: clamp(38px, 7vw, 70px);
      margin-bottom: 15px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 20px;
      line-height: 1.5;
      max-width: 700px;
      margin: 0 auto 40px;
    }

    .card {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 30px;
      text-align: left;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border-radius: 14px;
      border: 1px solid #475569;
      background: #020617;
      color: white;
      padding: 18px;
      font-size: 17px;
      outline: none;
    }

    textarea:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      padding: 17px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      color: #020617;
      background: linear-gradient(90deg, #38bdf8, #22d3ee);
    }

    button:hover {
      opacity: .9;
    }

    #resultado {
      display: none;
      margin-top: 25px;
      padding: 22px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid #38bdf8;
      color: #7dd3fc;
      border-radius: 999px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #64748b;
      padding: 40px 20px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">IMPULSA <span>IA</span></div>
  <div>Marketing inteligente</div>
</header>

<main>

  <div class="badge">✦ Inteligencia artificial para tu negocio</div>

  <h1>
    Convierte una idea en una campaña.
  </h1>

  <p class="subtitle">
    Describe tu promoción y deja que IMPULSA IA prepare
    una campaña de marketing en segundos.
  </p>

  <div class="card">

    <label for="promocion">
      ¿Qué quieres promocionar?
    </label>

    <textarea
      id="promocion"
      placeholder="Ejemplo: 30% de descuento en todos los zapatos este fin de semana..."
    ></textarea>

    <button onclick="generarCampana()">
      ✦ Generar campaña
    </button>

    <div id="resultado"></div>

  </div>

</main>

<footer>
  IMPULSA IA · Marketing impulsado por inteligencia artificial
</footer>

<script>
async function generarCampana() {
  const promocion = document.getElementById("promocion").value.trim();
  const resultado = document.getElementById("resultado");

  if (!promocion) {
    resultado.style.display = "block";
    resultado.textContent =
      "Escribe primero qué producto, servicio o promoción quieres anunciar.";
    return;
  }

  resultado.style.display = "block";
  resultado.textContent = "✨ IMPULSA IA está creando tu campaña...";

  try {
    const respuesta = await fetch("/api/generar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ promocion })
    });

    const datos = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(datos.error || "No se pudo generar la campaña.");
    }

    resultado.textContent = datos.resultado;
  } catch (error) {
    console.error(error);
    resultado.textContent =
      "No fue posible generar la campaña. Inténtalo nuevamente.";
  }
}
</script>

</body>
</html>
